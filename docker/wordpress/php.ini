; Local development settings shared by every wp-portfolio project.
;
; Opcache stays on so any performance figure quoted in a case study comes from
; a realistically configured PHP. Timestamp validation stays on too, so edits to
; bind-mounted plugin and theme files take effect on the next request.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.jit = tracing
opcache.jit_buffer_size = 64M

memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120

; Mail goes through SMTP set in a project mu-plugin (phpmailer_init), which is
; the path wp_mail() actually takes, so sendmail is not configured here.

display_errors = Off
log_errors = On
